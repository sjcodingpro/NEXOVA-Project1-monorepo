[project]
name = "nexova-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "tinydb==4.8.0",
    "pydantic[email]==2.9.2",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "resend>=2.44.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"seed.py" = "seed.py"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
