networks:
  nexova-network:
    driver: bridge

volumes:
  # Named volumes layered on top of the bind mounts below, specifically
  # so each container's OWN dependency install (built for its actual
  # architecture inside the image) isn't shadowed by the host's copy of
  # the same directory when the bind mount is applied. Without these,
  # `docker compose up` would work once on a fresh checkout, then break
  # the moment the host's node_modules/.venv (built for the host's own
  # OS/architecture) got mounted over the container's Linux-built one.
  website_node_modules:
  backoffice_node_modules:
  backend_venv:

services:
  backend:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - backend_venv:/app/.venv
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nexova-network

  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/app
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - nexova-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction
    networks:
      - nexova-network

  # Celery worker: its own process and container, NOT inside the FastAPI process.
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "-Q", "default,dlq", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ./services/api:/app
      - backend_venv:/app/.venv
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nexova-network

  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - nexova-network
